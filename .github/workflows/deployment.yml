name: CD - Deployment Staging y Rollback

on:
  push:
    branches:
      - feature/inventario
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'scripts/**'
      - '.github/workflows/deployment.yml'

  workflow_dispatch:

jobs:
  deployment-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build y validacion
        run: mvn -B clean verify

      - name: Dar permisos a scripts
        run: chmod +x scripts/*.sh

      - name: Desplegar version base 1.0.0
        run: bash scripts/deploy.sh 1.0.0

      - name: Desplegar nueva version 1.1.0
        run: bash scripts/deploy.sh 1.1.0

      - name: Ejecutar Acceptance Tests
        run: bash scripts/acceptance-test.sh

      - name: Mostrar version antes del rollback
        run: |
          echo "Version actualmente desplegada:"
          cat deploy/staging/current/version.txt

      - name: Ejecutar Rollback
        run: bash scripts/rollback.sh

      - name: Verificar Rollback
        run: |
          VERSION=$(cat deploy/staging/current/version.txt)

          echo "Version despues del rollback: $VERSION"

          if [ "$VERSION" != "1.0.0" ]; then
            echo "ERROR: El rollback no restauro la version 1.0.0"
            exit 1
          fi

          RESULTADO=$(java -cp deploy/staging/current/app.jar cl.iplacex.inventario.Main)

          echo "$RESULTADO"

          if echo "$RESULTADO" | grep -q "Stock disponible: 13"; then
            echo "Rollback verificado correctamente."
          else
            echo "ERROR: La aplicacion restaurada no funciona correctamente."
            exit 1
          fi

      - name: Guardar evidencia del deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-deployment-staging
          path: |
            deploy/staging/current/version.txt
            deploy/staging/backup/version.txt